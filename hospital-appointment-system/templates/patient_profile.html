<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">MediCare</div>

        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('doctors') }}">Doctors</a>
            <a href="{{ url_for('my_appointments') }}">My Appointments</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>


    <section class="form-section">

        <h1>My Profile</h1>

        <p>Update your personal information</p>

        <form method="POST">

            <label for="age">Age</label>
            <input type="number"
                   id="age"
                   name="age"
                   min="1"
                   max="120"
                   value="{{ patient.age or '' }}"
                   required>


            <label for="gender">Gender</label>

            <select id="gender" name="gender" required>

                <option value="">Select Gender</option>

                <option value="Male"
                    {% if patient.gender == 'Male' %}selected{% endif %}>
                    Male
                </option>

                <option value="Female"
                    {% if patient.gender == 'Female' %}selected{% endif %}>
                    Female
                </option>

                <option value="Other"
                    {% if patient.gender == 'Other' %}selected{% endif %}>
                    Other
                </option>

            </select>


            <label for="phone">Phone</label>

            <input type="text"
                   id="phone"
                   name="phone"
                   maxlength="15"
                   value="{{ patient.phone or '' }}"
                   required>


            <label for="address">Address</label>

            <textarea id="address"
                      name="address"
                      rows="4"
                      required>{{ patient.address or '' }}</textarea>


            <button type="submit" class="btn">
                Save Profile
            </button>

        </form>

    </section>

</body>
</html>
